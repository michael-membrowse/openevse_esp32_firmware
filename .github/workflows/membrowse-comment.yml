# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Posts the MemBrowse summary as a PR comment once "MemBrowse Memory Report"
# finishes. Runs in the base-repo context via workflow_run so it has the API
# key and write access even for fork PRs. The `workflows:` name below must
# match the `name:` of membrowse-report.yml exactly.
name: MemBrowse PR Comment

on:
  workflow_run:
    workflows: [MemBrowse Memory Report]
    types:
      - completed

jobs:
  comment:
    runs-on: ubuntu-latest
    # Run even if some builds failed — but skip cancelled runs and skipped runs
    # (e.g. draft PRs, where nothing is built or uploaded, so the summary lookup
    # would 404 on a commit with no report).
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Post combined PR comment
        if: ${{ env.MEMBROWSE_API_KEY != '' }}
        uses: membrowse/membrowse-action/comment-action@v1
        with:
          api_key: ${{ secrets.MEMBROWSE_API_KEY }}
          commit: ${{ github.event.workflow_run.head_sha }}
        env:
          MEMBROWSE_API_KEY: ${{ secrets.MEMBROWSE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
